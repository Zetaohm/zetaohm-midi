# cargo-deny: licenses, security advisories, doubled or wildcard dependencies, and crate sources
# of the whole workspace. CI runs `cargo deny check`.

[graph]
all-features = true

[advisories]
# The RustSec advisory database. Unmaintained crates count only when they are direct
# dependencies of a workspace crate.
unmaintained = "workspace"
ignore = []

[licenses]
# The library is MIT. Each dependency needs a permissive license from this list (or one of its
# alternatives in an OR expression).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
# Two versions of one crate cost flash on small targets: a warning shows each one.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
