[package]
name = "stm32wb55-usb-midi"
version = "0.1.0"
edition = "2021"
publish = false
description = "USB MIDI 2.0 and 1.0 echo firmware for the STM32WB55 (USB FS device) with zmidi-usb-embassy"
license = "MIT"

# DEC-003: examples are outside the Cargo workspace.
[workspace]

[dependencies]
zmidi-usb = { path = "../../crates/zmidi-usb", default-features = false }
zmidi-usb-embassy = { path = "../../crates/zmidi-usb-embassy" }
# The P-NUCLEO-WB55 has the STM32WB55RG. No time driver: the echo does not use a timer.
embassy-stm32 = { version = "0.6.0", features = ["stm32wb55rg", "rt", "defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-usb = { version = "0.6.0", default-features = false }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2.1.1"

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1

[profile.dev]
opt-level = "s"
