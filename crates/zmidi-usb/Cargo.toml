[package]
name = "zmidi-usb"
version = "0.1.0-alpha.1"
edition = "2021"
description = "USB-MIDI 2.0 and 1.0 (USB Device Class Definition for MIDI Devices) codecs and descriptors, no_std, no alloc and sans-IO"
license = "MIT"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zmidi-usb"
readme = "README.md"
keywords = ["midi", "midi2", "usb", "usb-midi", "no-std"]
categories = ["multimedia::audio", "hardware-support", "embedded", "no-std", "no-std::no-alloc"]

[lib]
name = "zmidi_usb"
path = "src/lib.rs"

[dependencies]
# The MIDI 1.0 families of Alternate Setting 0; the other families come with `alt1` (DEC-022).
zmidi-ump = { path = "../zmidi-ump", version = "0.1.0-alpha.1", default-features = false, features = [
    "system-common",
    "channel-voice1",
    "sysex7",
] }
zmidi-io = { path = "../zmidi-io", version = "0.1.0-alpha.1", default-features = false }
thiserror = { version = "2", default-features = false }

[features]
# DEC-002, DEC-014: the core API needs no alloc and no USB stack.
default = ["alt0", "alt1"]
# The data path of Alternate Setting 0 (USB-MIDI 1.0 Event Packets) in MidiLink. Off: Alternate Setting 0 has no
# Jack and no endpoint and the link reads and writes nothing there (DEC-014 addendum of 2026-10-23, DEC-017).
alt0 = []
# The USB MIDI 2.0 Alternate Settings 1 and higher (DEC-022): their data path in MidiLink (UMP packets),
# their descriptors and Group Terminal Blocks, and every zmidi-ump family. Off: a USB-MIDI 1.0-only
# function (`FunctionConfig::new` gives Alternate Setting 0 only) with no MIDI 2.0 code.
alt1 = ["zmidi-ump/full"]

[dev-dependencies]
proptest = "1"
