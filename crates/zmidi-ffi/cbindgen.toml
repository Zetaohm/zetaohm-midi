# DEC-019 rule 5: one header; C names zmidi_ / ZMIDI_ / Zmidi; a block for each part.
language = "C"
include_guard = "ZMIDI_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from crates/zmidi-ffi (DEC-019). Do not edit. */"
style = "both"
# The storage sizes depend on the pointer width (DEC-019 rule 1): the header finds it itself.
after_includes = """
#if !defined(ZMIDI_PTR64) && (UINTPTR_MAX > 0xFFFFFFFFu)
#define ZMIDI_PTR64
#endif
#if defined(_MSC_VER)
#define ZMIDI_ALIGNED(n) __declspec(align(n))
#else
#define ZMIDI_ALIGNED(n) __attribute__((aligned(n)))
#endif
/* The ci part (REQ-FFI-CI-009): ZMIDI_CI selects all of it, as the Cargo feature ci does, and each
 * ci feature implies the Device. */
#if defined(ZMIDI_CI)
#ifndef ZMIDI_CI_INITIATOR
#define ZMIDI_CI_INITIATOR
#endif
#ifndef ZMIDI_CI_PROFILES
#define ZMIDI_CI_PROFILES
#endif
#ifndef ZMIDI_CI_PROPERTY_EXCHANGE
#define ZMIDI_CI_PROPERTY_EXCHANGE
#endif
#ifndef ZMIDI_CI_PROCESS_INQUIRY
#define ZMIDI_CI_PROCESS_INQUIRY
#endif
#endif
#if !defined(ZMIDI_CI_DEVICE) && (defined(ZMIDI_CI_INITIATOR) || defined(ZMIDI_CI_PROFILES) || \
    defined(ZMIDI_CI_PROPERTY_EXCHANGE) || defined(ZMIDI_CI_PROCESS_INQUIRY))
#define ZMIDI_CI_DEVICE
#endif
/* The MIDI 1.0 parts (REQ-FFI-ABI-006): ZMIDI_MIDI1 selects all of them, as the Cargo feature midi1
 * does, and the io, ble and usb parts include their MIDI 1.0-only part. */
#if defined(ZMIDI_MIDI1)
#ifndef ZMIDI_IO_MIDI1
#define ZMIDI_IO_MIDI1
#endif
#ifndef ZMIDI_BLE_MIDI1
#define ZMIDI_BLE_MIDI1
#endif
#ifndef ZMIDI_USB_MIDI1
#define ZMIDI_USB_MIDI1
#endif
#ifndef ZMIDI_MESSAGES
#define ZMIDI_MESSAGES
#endif
#ifndef ZMIDI_CHANNEL_MODE
#define ZMIDI_CHANNEL_MODE
#endif
#ifndef ZMIDI_CONTROLLERS
#define ZMIDI_CONTROLLERS
#endif
#ifndef ZMIDI_PARAMETERS
#define ZMIDI_PARAMETERS
#endif
#ifndef ZMIDI_SYNC
#define ZMIDI_SYNC
#endif
#ifndef ZMIDI_ACTIVE_SENSING
#define ZMIDI_ACTIVE_SENSING
#endif
#ifndef ZMIDI_MPE
#define ZMIDI_MPE
#endif
#ifndef ZMIDI_GM
#define ZMIDI_GM
#endif
#ifndef ZMIDI_INQUIRY
#define ZMIDI_INQUIRY
#endif
#ifndef ZMIDI_DEVICE_CONTROL
#define ZMIDI_DEVICE_CONTROL
#endif
#ifndef ZMIDI_TUNING
#define ZMIDI_TUNING
#endif
#ifndef ZMIDI_MTC
#define ZMIDI_MTC
#endif
#ifndef ZMIDI_MMC_TRANSPORT
#define ZMIDI_MMC_TRANSPORT
#endif
#ifndef ZMIDI_NOTATION
#define ZMIDI_NOTATION
#endif
#endif
/* The General MIDI receiver needs the mode, controller and parameter parts, and the GM System
 * messages need the sysex base, as the Cargo feature gm does. */
#if defined(ZMIDI_GM)
#ifndef ZMIDI_CHANNEL_MODE
#define ZMIDI_CHANNEL_MODE
#endif
#ifndef ZMIDI_CONTROLLERS
#define ZMIDI_CONTROLLERS
#endif
#ifndef ZMIDI_PARAMETERS
#define ZMIDI_PARAMETERS
#endif
#endif
/* The MMC transport tier uses the MTC time, and each sysex part the sysex base. */
#if defined(ZMIDI_MMC_TRANSPORT) && !defined(ZMIDI_MTC)
#define ZMIDI_MTC
#endif
#if !defined(ZMIDI_SYSEX) && (defined(ZMIDI_GM) || defined(ZMIDI_INQUIRY) || \
    defined(ZMIDI_DEVICE_CONTROL) || defined(ZMIDI_TUNING) || defined(ZMIDI_MTC) || \
    defined(ZMIDI_NOTATION))
#define ZMIDI_SYSEX
#endif
/* The MPE receiver takes the events of the parameter receiver, as the Cargo feature mpe does. */
#if defined(ZMIDI_MPE) && !defined(ZMIDI_PARAMETERS)
#define ZMIDI_PARAMETERS
#endif
#if defined(ZMIDI_IO) && !defined(ZMIDI_IO_MIDI1)
#define ZMIDI_IO_MIDI1
#endif
#if defined(ZMIDI_BLE) && !defined(ZMIDI_BLE_MIDI1)
#define ZMIDI_BLE_MIDI1
#endif
#if defined(ZMIDI_USB) && !defined(ZMIDI_USB_MIDI1)
#define ZMIDI_USB_MIDI1
#endif
"""

[layout]
aligned_n = "ZMIDI_ALIGNED"

[defines]
"feature = io" = "ZMIDI_IO"
"feature = io-midi1" = "ZMIDI_IO_MIDI1"
"feature = ump" = "ZMIDI_UMP"
"feature = ble" = "ZMIDI_BLE"
"feature = ble-midi1" = "ZMIDI_BLE_MIDI1"
"feature = file" = "ZMIDI_FILE"
"feature = ci-device" = "ZMIDI_CI_DEVICE"
"feature = ci-initiator" = "ZMIDI_CI_INITIATOR"
"feature = ci-profiles" = "ZMIDI_CI_PROFILES"
"feature = ci-property-exchange" = "ZMIDI_CI_PROPERTY_EXCHANGE"
"feature = ci-process-inquiry" = "ZMIDI_CI_PROCESS_INQUIRY"
"feature = net" = "ZMIDI_NET"
"feature = net-auth" = "ZMIDI_NET_AUTH"
"feature = usb" = "ZMIDI_USB"
"feature = usb-midi1" = "ZMIDI_USB_MIDI1"
"feature = messages" = "ZMIDI_MESSAGES"
"feature = channel-mode" = "ZMIDI_CHANNEL_MODE"
"feature = controllers" = "ZMIDI_CONTROLLERS"
"feature = parameters" = "ZMIDI_PARAMETERS"
"feature = sync" = "ZMIDI_SYNC"
"feature = active-sensing" = "ZMIDI_ACTIVE_SENSING"
"feature = mpe" = "ZMIDI_MPE"
"feature = gm" = "ZMIDI_GM"
"feature = sysex" = "ZMIDI_SYSEX"
"feature = inquiry" = "ZMIDI_INQUIRY"
"feature = device-control" = "ZMIDI_DEVICE_CONTROL"
"feature = tuning" = "ZMIDI_TUNING"
"feature = mtc" = "ZMIDI_MTC"
"feature = mmc-transport" = "ZMIDI_MMC_TRANSPORT"
"feature = notation" = "ZMIDI_NOTATION"
"feature = midi1" = "ZMIDI_MIDI1"
"target_pointer_width = 64" = "ZMIDI_PTR64"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

# The kinds of the MIDI 1.0 parts (modules Midi1 and Sysex): no signature names them (the structs hold a
# uint32_t), so the header exports them by name for their constants.
[export]
include = [
  "ZmidiMidi1Kind",
  "ZmidiModeActionKind",
  "ZmidiControllerEventKind",
  "ZmidiParameterChange",
  "ZmidiSyncEventKind",
  "ZmidiSyncCommand",
  "ZmidiMpeZone",
  "ZmidiMpeRole",
  "ZmidiMpeEventKind",
  "ZmidiMpeClass",
  "ZmidiMpeMessage",
  "ZmidiGmLevel",
  "ZmidiSysexClass",
  "ZmidiDeviceControlKind",
  "ZmidiTuningKind",
  "ZmidiMmcCommandKind",
  "ZmidiMmcFieldKind",
]
