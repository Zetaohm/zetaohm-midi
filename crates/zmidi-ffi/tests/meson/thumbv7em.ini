# Cross file of the bare-metal Meson check (scripts/ffi-check.sh): Cortex-M4F with arm-none-eabi-gcc.
#   meson setup build --cross-file crates/zmidi-ffi/tests/meson/thumbv7em.ini
[binaries]
c = 'arm-none-eabi-gcc'
ar = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'

[built-in options]
c_args = ['-mcpu=cortex-m4', '-mthumb', '-mfloat-abi=hard', '-mfpu=fpv4-sp-d16']
c_link_args = ['-mcpu=cortex-m4', '-mthumb', '-mfloat-abi=hard', '-mfpu=fpv4-sp-d16', '--specs=nosys.specs']

[project options]
cargo_target = 'thumbv7em-none-eabihf'

[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'cortex-m4'
endian = 'little'
