[package]
name = "zmidi"
version = "0.1.0-alpha.1"
edition = "2021"
description = "MIDI 2.0 and MIDI 1.0: UMP, MIDI-CI, Property Exchange, MIDI Clip File, Network MIDI 2.0, USB-MIDI and BLE-MIDI; no_std, no alloc, sans-IO"
license = "MIT"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zmidi"
readme = "README.md"
keywords = ["midi", "midi2", "ump", "midi-ci", "no-std"]
categories = ["multimedia::audio", "embedded", "no-std", "no-std::no-alloc"]

# Default on, opt out (OPT-052 rule 1, DEC-017): `full` turns on each crate with its own default
# features; with `default-features = false` only zmidi-ump stays, with no message family.
[dependencies]
zmidi-ump = { path = "../zmidi-ump", version = "0.1.0-alpha.1", default-features = false }
zmidi-io = { path = "../zmidi-io", version = "0.1.0-alpha.1", default-features = false, optional = true }
zmidi-ci = { path = "../zmidi-ci", version = "0.1.0-alpha.1", default-features = false, optional = true }
zmidi-ci-pe = { path = "../zmidi-ci-pe", version = "0.1.0-alpha.1", default-features = false, optional = true }
zmidi-file = { path = "../zmidi-file", version = "0.1.0-alpha.1", default-features = false, optional = true }
zmidi-net = { path = "../zmidi-net", version = "0.1.0-alpha.1", default-features = false, optional = true }
zmidi-usb = { path = "../zmidi-usb", version = "0.1.0-alpha.1", default-features = false, optional = true }
zmidi-ble = { path = "../zmidi-ble", version = "0.1.0-alpha.1", default-features = false, optional = true }

[features]
default = ["full"]
full = ["midi1", "midi2"]
# Group features (DEC-022). `midi1`: every MIDI 1.0 part with no MIDI 2.0 code; build with
# `default-features = false, features = ["midi1"]` for MIDI 1.0-only firmware. `midi2`: each part with
# its MIDI 2.0 functions (the MIDI 1.0 parts too, with the MIDI 2.0 Protocol in them).
midi1 = ["ump-midi1", "io-midi1", "file-midi1", "ble-midi1", "usb-midi1"]
midi2 = ["ump", "io", "ci", "ci-pe", "file", "net", "usb", "ble"]
# Each part, with the default features of its crate. A `-midi1` part is the same crate with no MIDI 2.0
# code: the MIDI 1.0 message families of zmidi-ump, zmidi-io with no MIDI 2.0 Protocol, zmidi-file with
# no Clip File, zmidi-ble with no MIDI 2.0 Protocol, zmidi-usb with no USB MIDI 2.0 setting.
ump-midi1 = ["zmidi-ump/system-common", "zmidi-ump/channel-voice1", "zmidi-ump/sysex7"]
ump = ["ump-midi1", "zmidi-ump/full"]
io-midi1 = ["dep:zmidi-io", "zmidi-io/messages", "zmidi-io/channel-mode"]
io = ["io-midi1", "zmidi-io/full"]
ci = ["dep:zmidi-ci", "zmidi-ci/full"]
ci-pe = ["dep:zmidi-ci-pe", "zmidi-ci-pe/initiator"]
file-midi1 = ["dep:zmidi-file"]
file = ["file-midi1", "zmidi-file/full"]
net = ["dep:zmidi-net"]
usb-midi1 = ["dep:zmidi-usb", "zmidi-usb/alt0"]
usb = ["usb-midi1", "zmidi-usb/alt1"]
ble-midi1 = ["dep:zmidi-ble"]
ble = ["ble-midi1", "zmidi-ble/midi2-protocol"]
# "zlib+Mcoded7" Property Data (zmidi-ci-pe, DEC-PE-004); off by default.
zlib = ["ci-pe", "zmidi-ci-pe/zlib"]
# Network MIDI 2.0 authentication (zmidi-net, DEC-013); off by default.
auth = ["net", "zmidi-net/auth"]

[package.metadata.docs.rs]
all-features = true
