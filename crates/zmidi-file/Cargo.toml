[package]
name = "zmidi-file"
version = "0.1.0-alpha.1"
edition = "2021"
description = "MIDI Clip File (MIDI 2.0) and Standard MIDI File 1.0 reader and writer"
license = "MIT"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zmidi-file"
readme = "README.md"
keywords = ["midi", "midi2", "smf", "midi-file", "no-std"]
categories = ["multimedia::audio", "no-std", "no-std::no-alloc", "parser-implementations", "encoding"]

[lib]
name = "zmidi_file"
path = "src/lib.rs"

[dependencies]
# The SMF code needs no zmidi-ump family (DEC-021); the Clip File families come with the feature
# `clip`, the other families with `full` (DEC-017, OPT-048, DEC-022).
zmidi-ump = { path = "../zmidi-ump", version = "0.1.0-alpha.1", default-features = false }
thiserror = { version = "2", default-features = false }

[features]
# DEC-002: the core API needs no alloc. DEC-017: all message families are decoded by default; with
# `full` off, the Clip reader gives a message of another family as `Ump::Unknown`.
default = ["full"]
full = ["clip", "zmidi-ump/full"]
# The MIDI Clip File (M2-116, a MIDI 2.0 file format): its reader, writer and format modules, and the
# zmidi-ump families that its own rules need (Delta Clockstamps, Start and End of Clip, the PE SysEx
# check, Set Tempo and Set Time Signature). Off: only the Standard MIDI File modules, with no MIDI 2.0
# code (DEC-022, MIDI 1.0-only builds).
clip = ["zmidi-ump/utility", "zmidi-ump/ump-stream", "zmidi-ump/sysex7", "zmidi-ump/flex-data"]

[dev-dependencies]
# The Clip tests read every family, also when the feature matrix turns `full` off.
zmidi-ump = { path = "../zmidi-ump", features = ["full"] }
proptest = "1"
