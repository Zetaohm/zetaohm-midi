[package]
name = "zmidi-io"
version = "0.1.0-alpha.1"
edition = "2021"
description = "MIDI 1.0 byte streams to and from UMP, UMP Endpoint, Jitter Reduction and Group routing for MIDI 2.0, no_std and no alloc"
license = "MIT"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zmidi-io"
readme = "README.md"
keywords = ["midi", "midi2", "ump", "midi1", "no-std"]
categories = ["multimedia::audio", "embedded", "no-std", "no-std::no-alloc"]

[lib]
name = "zmidi_io"
path = "src/lib.rs"

[dependencies]
# The code calls the family parsers directly, not Ump::parse, so it needs no zmidi-ump family
# feature (DEC-017).
zmidi-ump = { path = "../zmidi-ump", version = "0.1.0-alpha.1", default-features = false }
thiserror = { version = "2", default-features = false }

[features]
# DEC-002: the core API needs no alloc. DEC-017: all features on by default.
default = ["full"]
full = ["midi2-protocol", "messages", "channel-mode", "controllers", "parameters", "sync", "active-sensing", "mpe"]
# BytesToUmp::new with StreamProtocol::Midi2: MIDI 2.0 Protocol output through the translator
# (M2-104 D.3). Off: BytesToUmp holds no translator (BytesToUmp::midi1 only).
# Also the MIDI 2.0 Channel Voice family of zmidi-ump: `UmpToBytes` translates a MIDI 2.0 Channel Voice
# UMP to MIDI 1.0 bytes only with it (DEC-022); without it, such a UMP gives no byte.
midi2-protocol = ["zmidi-ump/channel-voice2"]
# Typed MIDI 1.0 reader and writer on bytes, with no UMP Group (module messages, DEC-022).
messages = []
# MIDI 1.0 receiver mode state: Modes 1 to 4, Channel Mode messages (module channel_mode, DEC-022).
channel-mode = []
# MIDI 1.0 controller state of one channel: 14-bit pairs, bank and program, RP-015 reset (module
# controllers, DEC-022).
controllers = []
# MIDI 1.0 parameter receiver of one channel: RPN and NRPN, RP-018 steps (module parameters, DEC-022).
# It uses the RPN meanings of zmidi-ump (module controller, behind its feature channel-voice1).
parameters = ["zmidi-ump/channel-voice1"]
# MIDI 1.0 sync receiver: Start, Stop, Continue, Timing Clock, Song Position Pointer, Song Select
# (module sync, DEC-022).
sync = []
# MIDI 1.0 Active Sensing monitor and sender (module active_sensing, DEC-022).
active-sensing = []
# MIDI Polyphonic Expression (M1-100): Zone layout, receiver, class function, pitch helper, writers
# and note allocator (module mpe, DEC-022). The receiver takes the RPN events of `parameters`.
mpe = ["parameters"]

[dev-dependencies]
proptest = "1"
# The tests decode UMPs with Ump::parse.
zmidi-ump = { path = "../zmidi-ump", version = "0.1.0-alpha.1", features = ["full"] }
