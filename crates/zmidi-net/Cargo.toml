[package]
name = "zmidi-net"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Network MIDI 2.0 (UDP, M2-124-UM) for MIDI 2.0, no_std, no alloc and sans-IO"
license = "MIT"

[lib]
name = "zmidi_net"
path = "src/lib.rs"

[dependencies]
zmidi-ump = { path = "../zmidi-ump", version = "0.1.0-alpha.1", default-features = false, features = ["full"] }
thiserror = { version = "2", default-features = false }
# DEC-013: SHA-256 for the Authentication Digest, no alloc. `zeroize` clears the hash state,
# which holds secret bytes, when it is dropped (REQ-NET-AUTH-011).
sha2 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }

[features]
# DEC-002, DEC-012: the core API needs no alloc.
default = []
# Invitation with Authentication and with User Authentication (DEC-013).
auth = ["dep:sha2"]

[dev-dependencies]
proptest = "1"
